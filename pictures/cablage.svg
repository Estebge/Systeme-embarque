<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 612" width="1060" height="612" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1060" height="612" fill="#ffffff"/>

  <text x="530" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Station météo embarquée — câblage</text>
  <text x="530" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Arduino Uno (ATmega328P) — broches utilisées par StationMeteo.ino</text>

  <!-- ================= Carte Arduino ================= -->
  <rect x="430" y="92" width="200" height="336" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="530" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">Arduino Uno</text>
  <text x="530" y="149" text-anchor="middle" font-size="12" fill="#0369a1">ATmega328P</text>
  <line x1="455" y1="163" x2="605" y2="163" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="530" y="187" text-anchor="middle" font-size="11.5" fill="#0c4a6e">32 Ko flash · 2 Ko RAM</text>
  <text x="530" y="206" text-anchor="middle" font-size="11.5" fill="#0c4a6e">1 Ko EEPROM</text>
  <text x="530" y="238" text-anchor="middle" font-size="11.5" fill="#0c4a6e">Port série USB</text>
  <text x="530" y="256" text-anchor="middle" font-size="11.5" fill="#0c4a6e">9600 bauds</text>
  <line x1="455" y1="278" x2="605" y2="278" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="530" y="302" text-anchor="middle" font-size="11.5" fill="#0369a1">INT0 = D2</text>
  <text x="530" y="320" text-anchor="middle" font-size="11.5" fill="#0369a1">INT1 = D3</text>
  <text x="530" y="348" text-anchor="middle" font-size="11.5" fill="#0369a1">SPI = D11·D12·D13</text>
  <text x="530" y="366" text-anchor="middle" font-size="11.5" fill="#0369a1">I²C = A4·A5</text>
  <text x="530" y="402" text-anchor="middle" font-size="11.5" font-style="italic" fill="#0284c7">alimentation 5 V</text>

  <!-- ================= Colonne gauche : capteurs ================= -->

  <!-- BME280 -->
  <rect x="40" y="92" width="250" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="118" font-size="14" font-weight="600" fill="#4c1d95">BME280</text>
  <text x="60" y="138" font-size="11.5" fill="#6d28d9">Température · Pression · Humidité</text>
  <line x1="290" y1="122" x2="430" y2="122" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="430" cy="122" r="3.5" fill="#7c3aed"/>
  <rect x="308" y="108" width="104" height="17" rx="3" fill="#ffffff"/>
  <text x="360" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">A4 / A5 · I²C 0x76</text>

  <!-- DS3231 -->
  <rect x="40" y="182" width="250" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="208" font-size="14" font-weight="600" fill="#4c1d95">DS3231</text>
  <text x="60" y="228" font-size="11.5" fill="#6d28d9">Horloge temps réel — date et heure</text>
  <line x1="290" y1="212" x2="430" y2="212" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="430" cy="212" r="3.5" fill="#7c3aed"/>
  <rect x="316" y="198" width="88" height="17" rx="3" fill="#ffffff"/>
  <text x="360" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">A4 / A5 · I²C</text>

  <!-- Photorésistance -->
  <rect x="40" y="272" width="250" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="298" font-size="14" font-weight="600" fill="#7f1d1d">Photorésistance</text>
  <text x="60" y="318" font-size="11.5" fill="#b91c1c">Luminosité ambiante</text>
  <line x1="290" y1="302" x2="430" y2="302" stroke="#dc2626" stroke-width="2"/>
  <circle cx="430" cy="302" r="3.5" fill="#dc2626"/>
  <rect x="318" y="288" width="84" height="17" rx="3" fill="#ffffff"/>
  <text x="360" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">A0 · analogique</text>

  <!-- GPS -->
  <rect x="40" y="362" width="250" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="60" y="388" font-size="14" font-weight="600" fill="#7c2d12">Module GPS</text>
  <text x="60" y="408" font-size="11.5" fill="#c2410c">Trames NMEA — 9600 bauds</text>
  <line x1="290" y1="392" x2="430" y2="392" stroke="#ea580c" stroke-width="2"/>
  <circle cx="430" cy="392" r="3.5" fill="#ea580c"/>
  <rect x="310" y="378" width="100" height="17" rx="3" fill="#ffffff"/>
  <text x="360" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">D8 / D9 · UART</text>

  <!-- ================= Colonne droite : périphériques ================= -->

  <!-- Carte SD -->
  <rect x="770" y="92" width="250" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="790" y="118" font-size="14" font-weight="600" fill="#064e3b">Lecteur carte SD</text>
  <text x="790" y="138" font-size="11.5" fill="#047857">Archivage de data.csv</text>
  <line x1="630" y1="122" x2="770" y2="122" stroke="#059669" stroke-width="2"/>
  <circle cx="630" cy="122" r="3.5" fill="#059669"/>
  <rect x="644" y="108" width="112" height="17" rx="3" fill="#ffffff"/>
  <text x="700" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">D4 (CS) + SPI · D11–13</text>

  <!-- LED -->
  <rect x="770" y="182" width="250" height="60" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="790" y="208" font-size="14" font-weight="600" fill="#713f12">LED RGB chaînable</text>
  <text x="790" y="228" font-size="11.5" fill="#a16207">Mode et diagnostic d'erreur</text>
  <line x1="630" y1="212" x2="770" y2="212" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="630" cy="212" r="3.5" fill="#ca8a04"/>
  <rect x="642" y="198" width="116" height="17" rx="3" fill="#ffffff"/>
  <text x="700" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">D5 (data) / D6 (clk)</text>

  <!-- Bouton vert -->
  <rect x="770" y="272" width="250" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="790" y="298" font-size="14" font-weight="600" fill="#1e3a8a">Bouton poussoir vert</text>
  <text x="790" y="318" font-size="11.5" fill="#1d4ed8">Bascule standard ↔ économique</text>
  <line x1="630" y1="302" x2="770" y2="302" stroke="#2563eb" stroke-width="2"/>
  <circle cx="630" cy="302" r="3.5" fill="#2563eb"/>
  <rect x="646" y="288" width="108" height="17" rx="3" fill="#ffffff"/>
  <text x="700" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">D2 · INT0 · pull-up</text>

  <!-- Bouton rouge -->
  <rect x="770" y="362" width="250" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="790" y="388" font-size="14" font-weight="600" fill="#1e3a8a">Bouton poussoir rouge</text>
  <text x="790" y="408" font-size="11.5" fill="#1d4ed8">Configuration et maintenance</text>
  <line x1="630" y1="392" x2="770" y2="392" stroke="#2563eb" stroke-width="2"/>
  <circle cx="630" cy="392" r="3.5" fill="#2563eb"/>
  <rect x="646" y="378" width="108" height="17" rx="3" fill="#ffffff"/>
  <text x="700" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">D3 · INT1 · pull-up</text>

  <!-- ================= Légende ================= -->
  <line x1="40" y1="468" x2="1020" y2="468" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="40" y="496" font-size="12.5" font-weight="700" fill="#374151">Bus</text>

  <line x1="90" y1="492" x2="126" y2="492" stroke="#7c3aed" stroke-width="3"/>
  <text x="134" y="496" font-size="12" fill="#374151">I²C</text>

  <line x1="180" y1="492" x2="216" y2="492" stroke="#059669" stroke-width="3"/>
  <text x="224" y="496" font-size="12" fill="#374151">SPI</text>

  <line x1="272" y1="492" x2="308" y2="492" stroke="#ea580c" stroke-width="3"/>
  <text x="316" y="496" font-size="12" fill="#374151">UART logiciel</text>

  <line x1="420" y1="492" x2="456" y2="492" stroke="#2563eb" stroke-width="3"/>
  <text x="464" y="496" font-size="12" fill="#374151">Numérique / interruption</text>

  <line x1="642" y1="492" x2="678" y2="492" stroke="#ca8a04" stroke-width="3"/>
  <text x="686" y="496" font-size="12" fill="#374151">2-wire</text>

  <line x1="750" y1="492" x2="786" y2="492" stroke="#dc2626" stroke-width="3"/>
  <text x="794" y="496" font-size="12" fill="#374151">Analogique</text>

  <text x="40" y="528" font-size="11.5" fill="#6b7280">Montage en trois cartes empilées : Arduino Uno, shield carte SD, Grove Base Shield. Les six périphériques se branchent sur le shield Grove.</text>
  <text x="40" y="549" font-size="11.5" fill="#6b7280">Un connecteur Grove numérique porte deux broches consécutives : les boutons occupent D2 et D3, la LED D5 et D6, le GPS D8 et D9.</text>
  <text x="40" y="570" font-size="11.5" fill="#6b7280">Le BME280 et le DS3231 partagent le bus I²C (A4 = SDA, A5 = SCL) ; le lecteur SD, sur son propre shield, occupe le bus SPI matériel D11–D13 avec D4 en sélection de puce.</text>
  <text x="40" y="591" font-size="11.5" fill="#9ca3af">Schéma reconstitué à partir des affectations de broches déclarées dans StationMeteo.ino.</text>
</svg>
